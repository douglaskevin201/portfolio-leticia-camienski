<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Kevin Douglas">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f5f3ee">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'">
    <title>Projeto | Leticia Camienski</title>
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="assets/js/site.js" defer></script>
</head>
<body class="project-page">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <header class="project-header">
        <a class="brand brand-dark" href="index.html" aria-label="Voltar à página inicial">
            <span class="brand-mark" aria-hidden="true">L</span>
            <span class="brand-name">Leticia Camienski<small>Técnica em Edificações</small></span>
        </a>
        <a class="back-link" href="index.html#projetos"><span aria-hidden="true">←</span> Projetos</a>
    </header>

    <main id="conteudo">
        <section class="project-intro">
            <p class="eyebrow" id="project-category">Portfólio · Projeto</p>
            <h1 id="project-title">Projeto selecionado</h1>
            <p class="project-description" id="project-description"></p>
            <p class="project-credit" id="project-credit"></p>
        </section>
        <section class="gallery-section" aria-label="Imagens do projeto">
            <div class="gallery-grid" id="gallery"></div>
        </section>
        <p class="project-not-found" id="project-not-found" hidden>
            Este projeto não foi encontrado. <a href="index.html#projetos">Voltar à seleção de projetos</a>
        </p>
        <div class="project-end">
            <a class="text-link" href="index.html#projetos"><span aria-hidden="true">←</span> Voltar para os projetos</a>
        </div>
    </main>

    <dialog class="lightbox" id="lightbox" aria-label="Visualização da imagem">
        <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Fechar imagem">×</button>
        <div class="lightbox-tools" role="group" aria-label="Controles da imagem">
            <label for="lightbox-zoom">Zoom</label>
            <input id="lightbox-zoom" type="range" min="1" max="4" step="0.1" value="1" aria-label="Nível de zoom">
            <output id="lightbox-zoom-value" for="lightbox-zoom">100%</output>
            <button class="lightbox-zoom-reset" id="lightbox-zoom-reset" type="button" aria-label="Redefinir zoom">Ajustar</button>
        </div>
        <button class="lightbox-arrow lightbox-previous" id="lightbox-previous" type="button" aria-label="Imagem anterior">←</button>
        <img id="lightbox-image" alt="" draggable="false">
        <button class="lightbox-arrow lightbox-next" id="lightbox-next" type="button" aria-label="Próxima imagem">→</button>
        <p class="lightbox-count" id="lightbox-count"></p>
    </dialog>

</body>
</html>
